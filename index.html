<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melody - Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="player">
    <header class="topbar">
      <div class="brand">♫ Melody</div>
      <span class="tag">YOUR MUSIC SPACE</span>
    </header>

    <section class="now-playing">
      <div class="album-art">
        <span class="vinyl">♫</span>
      </div>

      <p class="eyebrow">NOW PLAYING</p>
      <h1 id="songTitle">Dreams</h1>
      <p class="artist" id="artistName">Artist One</p>

      <audio id="audio" preload="metadata"></audio>

      <div class="progress-area">
        <input id="progress" type="range" min="0" max="100" value="0" aria-label="Song progress">
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="prevBtn" aria-label="Previous song">|◀</button>
        <button id="playBtn" class="play-btn" aria-label="Play">▶</button>
        <button id="nextBtn" aria-label="Next song">▶|</button>
      </div>

      <div class="volume-row">
        <span>🔈 Volume</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
        <span>🔊</span>
      </div>

      <label class="autoplay">
        <input type="checkbox" id="autoplay" checked>
        Play next song automatically
      </label>
    </section>

    <section class="playlist-section">
      <div class="playlist-heading">
        <h2>My Playlist</h2>
        <span>3 tracks</span>
      </div>
      <div id="playlist" class="playlist"></div>
    </section>

    <footer>Made with ♡ and music</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
